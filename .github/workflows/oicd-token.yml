name: Test getting OIDC token

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - id: token
      uses: actions/github-script@v7
      with:
        script: |
          const token = await core.getIDToken()
          core.setSecret(token)
          core.setOutput("token", token)

    - run: |
        env
      env:
        TOKEN: ${{ steps.token.outputs.token }}
        
