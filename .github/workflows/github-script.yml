name: Test script

on:
  workflow_dispatch:
    inputs:
      test:
        description: Just to give an input
        default: value
        type: string
      boolean:
        description: Just to give a boolean input
        default: true
        type: boolean
      number:
        description: Just to give a number input
        default: 42
        type: number
      environment:
        description: Just to give an environment input
        required: false
        type: environment

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        continue-on-error: true
        id: previous
        with:
          script: |
            // https://docs.github.com/en/webhooks-and-events/webhooks/webhook-events-and-payloads#push
            // https://github.com/actions/toolkit/blob/main/packages/github/src/context.ts
            console.log('context:', context)

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'github-script.yml',
              branch: 'main',
              event: 'push',
              status: 'success',
              per_page: 1,
            });
            if (runs.data.workflow_runs.length) {
              core.setOutput('sha', runs.data.workflow_runs[0].head_sha)
            }

            console.log('runs:', runs)
            for(const run of runs.data.workflow_runs) {
              console.log(run)
            }

      - run: echo ${{ steps.previous.outputs.sha }}
        continue-on-error: true

      - name: context
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: |
            console.log(context)

      - name: github
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: |
            console.log(github)
