name: Self hosted

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  build:

    runs-on: [self-hosted]

    steps:
    - name: Id
      run: id

    - name: List environment
      run: env | sort

    - name: scan pipx
      run: pipx list
      continue-on-error: true

    - uses: actions/checkout@v6

    - name: Cache MongoDB binary
      uses: actions/cache@v5
      with:
        path: ~/.cache/mongodb-binaries
        key: mongodb
      continue-on-error: true

    - uses: actions/setup-node@v6
      with:
        node-version: 16
      continue-on-error: true

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        # Install with pip cache is slower than without it. Wheels get rebuilt so cache does not help.
        # cache: 'pip' # caching pip dependencies
        # cache-dependency-path: 'ava/py/unittest/requirements.txt'
      continue-on-error: true

    # Setup container builder for the cache
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      continue-on-error: true

    - name: Test local action
      uses: ./action
      with:
        args: echo $# - $0 - "$@"
        run: |
          echo running
          pwd
          env|sort
          echo '${{ toJSON(github) }}'
          echo '${{ toJSON(job) }}'
          echo '${{ toJSON(runner) }}'
          find /github
          find /home
          echo args: $#
          for arg in "$@"
          do
              echo - "$arg"
          done
          # false
          # echo past failure

    - run: echo Here
