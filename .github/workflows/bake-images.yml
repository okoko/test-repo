name: Test docker-bake metadata

on:
  workflow_dispatch:

env:
  CC_REGISTRY: ghcr.io/neuralnet
  IMAGE_TAG: ${{ github.run_number }}

jobs:
  bake:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - uses: docker/bake-action@76cc8060bdff6d632a465001e4cf300684c5472c # v5.7.0
      id: build
      with:
        files: docker-bake.hcl

    - name: Save built images list
      run: echo "${{ steps.build.outputs.images }}" > ${{ runner.temp }}/images.txt

    - name: Upload built images list
      uses: actions/upload-artifact@v4
      with:
        name: built-images
        path: ${{ runner.temp }}/images.txt

    - run: |
        tags=$(jq -r '.[]."image.name" | split(",") | .[] | select(. | endswith(":latest") |not) | ltrimstr("docker.io/")' << DATA
        $METADATA
        DATA
        )
        echo "$tags"
      env:
        METADATA: ${{ steps.build.outputs.metadata }}

    - run: |
        echo '${{ steps.build.outputs.metadata.*.image.name }}'

    - name: List images
      run: |
        docker image ls

  process:
    runs-on: ubuntu-latest
    steps:
    - name: Download built images list
      uses: actions/download-artifact@v4
      with:
        name: built-images
        path: ${{ runner.temp }}

    - name: Push Docker images
      run: |
        for r in $(cat ${{ runner.temp }}/images.txt) "neuralnet/ccdocgpu1:$IMAGE_TAG"
        do
          docker tag $r "$CC_REGISTRY$r"
          docker push "$CC_REGISTRY$r"
          docker tag $r "$CC_REGISTRY${r%:*}:latest"
          docker push "$CC_REGISTRY${r%:*}:latest"
        done
