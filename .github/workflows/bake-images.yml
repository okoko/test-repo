name: Test docker-bake metadata

on:
  workflow_dispatch:

env:
  CC_REGISTRY: ghcr.io/neuralnet/
  IMAGE_TAG: ${{ github.run_number }}

jobs:
  bake:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

    - uses: docker/bake-action@5ca506d06f70338a4968df87fd8bfee5cbfb84c7 # v6.0.0
      id: build
      with:
        files: docker-bake.hcl

    - name: Save metadata images list
      run: echo "$METADATA" > "${{ runner.temp }}/metadata.json"
      env:
        METADATA: ${{ steps.build.outputs.metadata }}

    - run: cat "${{ runner.temp }}/metadata.json"

    # The metadata for docker-container driver does not contain tags.
    - run: |
        docker buildx bake --file docker-bake.hcl --print |
        jq -r '.target | .[].tags | .[] | select(. | endswith(":latest") | not)' > "${{ runner.temp }}/images.txt"

    - name: Upload built images list
      uses: actions/upload-artifact@v4
      with:
        name: built-images
        path: |
          ${{ runner.temp }}/images.txt

    - name: List images
      run: |
        docker image ls

  process:
    runs-on: ubuntu-latest
    needs: bake
    steps:
    - name: Download built images list
      uses: actions/download-artifact@v4
      with:
        name: built-images
        path: ${{ runner.temp }}

    - name: Push Docker images
      run: |
        set -x
        for r in $(cat ${{ runner.temp }}/images.txt) "neuralnet/ccdocgpu1:$IMAGE_TAG"
        do
          docker tag $r "$CC_REGISTRY$r"
          echo docker push "$CC_REGISTRY$r"
          docker tag $r "$CC_REGISTRY${r%:*}:latest"
          echo docker push "$CC_REGISTRY${r%:*}:latest"
        done
