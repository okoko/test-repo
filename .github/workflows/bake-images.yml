name: Test docker-bake metadata

on:
  workflow_dispatch:

env:
  CC_REGISTRY: ghcr.io/neuralnet/
  IMAGE_TAG: ${{ github.run_number }}

jobs:
  bake:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

    - uses: docker/bake-action@4ba453fbc2db7735392b93edf935aaf9b1e8f747 # v6.5.0
      id: build
      with:
        source: .
        files: docker-bake.hcl

    - name: Save metadata images list
      run: echo "$METADATA" > "$RUNNER_TEMP/metadata.json"
      env:
        METADATA: ${{ steps.build.outputs.metadata }}

    - run: cat "$RUNNER_TEMP/metadata.json"

    # The metadata for docker-container driver does not contain tags.
    - run: |
        docker buildx bake --file docker-bake.hcl --print |
        jq -r '.target | .[].tags | .[] | select(. | endswith(":latest") | not)' > "$RUNNER_TEMP/images.txt"

    - name: Upload built images list
      uses: actions/upload-artifact@v4
      with:
        name: built-images
        path: |
          ${{ runner.temp }}/images.txt

    - name: List images
      run: |
        docker image ls

  process:
    runs-on: ubuntu-latest
    needs: bake
    steps:
    - name: Download built images list
      uses: actions/download-artifact@v4
      with:
        name: built-images
        path: ${{ runner.temp }}

    - name: Push Docker images
      run: |
        set -x
        for r in $(cat "$RUNNER_TEMP/images.txt") "neuralnet/ccdocgpu1:$IMAGE_TAG"
        do
          docker tag $r "$CC_REGISTRY$r"
          echo docker push "$CC_REGISTRY$r"
          docker tag $r "$CC_REGISTRY${r%:*}:latest"
          echo docker push "$CC_REGISTRY${r%:*}:latest"
        done
